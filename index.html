<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5c47">
<title>Calma · propuesta de diseño</title>
<style>
:root{
  --g:#138f69; --g-dk:#0f5c47; --g-bg:#ecf5f0; --g-lt:#bff0dc;
  --ink:#17302a; --soft:#5a6a64; --mute:#8b9893; --line:#e3e9e5;
  --bg:#f3f6f4; --card:#fff;
  --red:#c93a3a; --red-bg:#fbe8e8; --amb:#b9741e; --amb-bg:#fbf0de;
  --src-g:#3b7be0; --src-ms:#7a5ad8; --src-movil:#8b9893;
  --stage:#e6ece9;
}
body.theme-empresa{
  --g:#018ebc; --g-dk:#01698c; --g-bg:#e9f4f9; --g-lt:#bfe6f4;
  --ink:#23272a; --soft:#5a6165; --mute:#899095; --line:#dde3e6; --bg:#f2f5f7; --stage:#e4e9ec;
}
.screen.casa{
  --g:#a8632a; --g-dk:#7c4519; --g-bg:#f6e8d8; --g-lt:#f3d6b6;
  --bg:#f6efe6; --card:#fffaf3; --line:#ecdfcf; --soft:#6d5f52; --ink:#3a2a1d;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--stage); color:var(--ink); -webkit-font-smoothing:antialiased; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; }
svg{ display:block; flex:none; }

/* ---------- escenario (ordenador) ---------- */
.topbar{ height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; }
.tb-brand{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; }
.tb-logo{ width:30px; height:30px; border-radius:9px; background:var(--g); color:#fff; display:flex; align-items:center; justify-content:center; }
.tb-brand small{ font-weight:400; color:var(--soft); font-size:13px; }
.modes{ display:flex; background:#fff; border-radius:999px; padding:4px; gap:4px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.modes button{ padding:8px 16px; border-radius:999px; font-size:14px; font-weight:600; color:var(--soft); }
.modes button.on{ background:var(--g); color:#fff; }
.layout{ display:flex; gap:40px; justify-content:center; align-items:center; padding:8px 24px 24px; min-height:calc(100vh - 56px); }
.device{ width:396px; height:min(830px, calc(100vh - 88px)); background:#121a17; border-radius:52px; padding:11px; box-shadow:0 30px 60px rgba(20,40,32,.25); flex:none; position:relative; transition:width .35s, height .35s, border-radius .35s; }
.device.monitor{ width:min(900px, calc(100vw - 460px)); height:min(580px, calc(100vh - 120px)); border-radius:18px; padding:12px; }
.screen{ position:relative; width:100%; height:100%; border-radius:42px; overflow:hidden; background:var(--bg); display:flex; flex-direction:column; font-size:15px; color:var(--ink); transition:background .4s; }
.device.monitor .screen{ border-radius:8px; }

/* ---------- guía ---------- */
.guide{ width:360px; flex:none; }
.g-card{ background:#fff; border-radius:22px; padding:24px 24px 20px; box-shadow:0 10px 30px rgba(20,40,32,.08); }
.g-step{ font-size:12px; letter-spacing:1.6px; text-transform:uppercase; font-weight:700; color:var(--g); }
.g-bar{ height:4px; background:var(--line); border-radius:4px; margin:10px 0 18px; overflow:hidden; }
.g-bar i{ display:block; height:100%; background:var(--g); border-radius:4px; transition:width .4s; }
.g-time{ font-size:34px; font-weight:700; letter-spacing:-1px; color:var(--g-dk); line-height:1; }
.g-title{ font-size:21px; font-weight:700; letter-spacing:-.3px; margin:8px 0 8px; line-height:1.2; }
.g-text{ font-size:15px; line-height:1.55; color:var(--soft); margin:0 0 14px; }
.g-refs{ display:flex; flex-direction:column; gap:6px; margin-bottom:18px; }
.g-ref{ display:flex; gap:8px; align-items:center; font-size:13px; background:var(--g-bg); border-radius:10px; padding:7px 10px; color:var(--g-dk); }
.g-ref b{ width:20px; height:20px; border-radius:50%; background:var(--g); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:11px; flex:none; }
.g-ctrl{ display:flex; gap:8px; }
.g-ctrl button{ flex:1; padding:12px 10px; border-radius:12px; font-weight:600; font-size:14px; background:var(--g-bg); color:var(--g-dk); }
.g-ctrl button.main{ background:var(--g); color:#fff; flex:1.4; }
.g-ctrl button:disabled{ opacity:.4; cursor:default; }
.g-foot{ font-size:11.5px; color:var(--mute); margin-top:14px; line-height:1.4; }
.g-list{ display:flex; flex-direction:column; gap:4px; margin:6px 0 16px; max-height:52vh; overflow:auto; }
.g-list button{ display:flex; align-items:center; gap:10px; text-align:left; font-size:14px; padding:8px 10px; border-radius:10px; }
.g-list button:hover{ background:var(--g-bg); }
.g-list b{ width:22px; height:22px; border-radius:50%; background:var(--g-bg); color:var(--g-dk); display:inline-flex; align-items:center; justify-content:center; font-size:11.5px; flex:none; }
.g-list span{ flex:1; }
.g-list em{ font-style:normal; font-size:12px; color:var(--g); font-weight:600; }
.g-mobile{ display:none; }

/* ---------- barra de estado y navegación ---------- */
.sb{ height:44px; flex:none; display:flex; align-items:flex-end; justify-content:space-between; padding:0 30px 6px; font-size:14px; font-weight:600; }
.sb.light{ color:#fff; position:absolute; top:0; left:0; right:0; z-index:5; }
.sb-ic{ display:flex; gap:6px; align-items:center; }
.sb-ic i{ display:block; width:16px; height:10px; border:1.5px solid currentColor; border-radius:3px; position:relative; }
.sb-ic i:after{ content:""; position:absolute; inset:1.5px; right:4px; background:currentColor; border-radius:1px; }
.content{ flex:1; overflow-y:auto; overflow-x:hidden; padding:6px 18px 44px; scrollbar-width:none; }
.content::-webkit-scrollbar{ display:none; }
.nav{ flex:none; height:78px; background:var(--card); border-top:1px solid var(--line); display:flex; align-items:flex-start; justify-content:space-around; padding:8px 8px 0; position:relative; }
.nav button{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; font-weight:600; color:var(--mute); width:64px; padding-top:4px; }
.nav button.on{ color:var(--g-dk); }
.nav .mic{ width:66px; height:66px; border-radius:50%; background:var(--g); color:#fff; margin-top:-26px; box-shadow:0 8px 18px rgba(0,0,0,.18), 0 0 0 5px var(--bg); justify-content:center; padding:0; }
.nav .mic span{ display:none; }

/* ---------- elementos comunes ---------- */
.dim{ color:var(--soft); font-size:13px; }
.card{ background:var(--card); border-radius:20px; padding:16px; margin-top:12px; box-shadow:0 1px 2px rgba(0,0,0,.04); display:block; width:100%; text-align:left; }
.c-t{ font-size:12px; letter-spacing:1.3px; text-transform:uppercase; font-weight:700; color:var(--mute); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
.c-t a{ letter-spacing:0; text-transform:none; color:var(--g); font-size:13px; }
.row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:14.5px; }
.row:first-of-type{ border-top:0; }
.row .r-main{ flex:1; min-width:0; }
.row .r-main small{ display:block; color:var(--soft); font-size:12.5px; margin-top:1px; }
.badge{ font-size:11.5px; font-weight:700; border-radius:8px; padding:3px 8px; white-space:nowrap; }
.b-red{ background:var(--red-bg); color:var(--red); } .b-amb{ background:var(--amb-bg); color:var(--amb); } .b-ok{ background:var(--g-bg); color:var(--g-dk); } .b-gray{ background:#eef1f0; color:var(--soft); }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--g); color:#fff; font-weight:600; font-size:14.5px; border-radius:14px; padding:12px 16px; }
.btn.soft{ background:var(--g-bg); color:var(--g-dk); }
.btn.small{ padding:7px 11px; font-size:13px; border-radius:10px; }
.btn.block{ width:100%; }
.st{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; color:#fff; }
.st.ok{ background:var(--g); } .st.tarde{ background:var(--red); } .st.espera{ background:#a7b0ad; }
.back{ display:flex; align-items:center; gap:4px; color:var(--g-dk); font-weight:600; font-size:15px; padding:6px 0 8px; }
.h2{ font-size:26px; font-weight:750; letter-spacing:-.6px; margin:4px 0 2px; line-height:1.15; }
.links{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
.links button{ font-size:12.5px; color:var(--g-dk); background:var(--g-bg); border-radius:999px; padding:6px 11px; font-weight:600; }
.toast{ position:absolute; left:16px; right:16px; bottom:96px; background:#22302b; color:#fff; border-radius:14px; padding:12px 14px; font-size:14px; z-index:30; animation:up .3s ease; box-shadow:0 10px 24px rgba(0,0,0,.25); }

/* ---------- Hoy ---------- */
.hoy-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding-top:6px; }
.hl{ font-size:27px; line-height:1.12; letter-spacing:-.7px; margin:4px 0 4px; font-weight:750; }
.hl span{ color:var(--g); }
.avatar{ width:42px; height:42px; border-radius:50%; background:var(--g-bg); color:var(--g-dk); display:flex; align-items:center; justify-content:center; flex:none; }
.dbar{ position:relative; height:38px; background:#eef2f0; border-radius:12px; margin:2px 0 4px; }
.screen.casa .dbar{ background:#f1e6d8; }
.dbar .ev{ position:absolute; top:6px; bottom:6px; background:var(--g-bg); border:1.5px solid var(--g); border-radius:8px; }
.dbar .ev.casa{ background:#f6e8d8; border-color:#c58a52; }
.dbar .gap{ position:absolute; top:6px; bottom:6px; border:1.5px dashed var(--g); border-radius:8px; }
.dbar .now{ position:absolute; top:-4px; bottom:-4px; width:3px; border-radius:2px; background:var(--red); }
.dhrs{ display:flex; justify-content:space-between; font-size:11px; color:var(--mute); margin-bottom:4px; }
.road{ position:relative; height:66px; margin:2px 4px 0; }
.road .ln{ position:absolute; left:0; right:0; top:30px; height:3px; border-radius:2px; background:#dfe5e2; }
.road .pt{ position:absolute; top:24px; width:15px; height:15px; border-radius:50%; margin-left:-7px; box-shadow:0 0 0 3px var(--card); }
.road .lb{ position:absolute; font-size:11.5px; color:var(--soft); white-space:nowrap; transform:translateX(-50%); }
.road .lb.up{ top:0; } .road .lb.dn{ top:46px; }
.road .ends{ position:absolute; top:46px; font-size:10.5px; color:var(--mute); }

/* ---------- Habla ---------- */
.chat-head{ display:flex; align-items:center; gap:10px; padding:4px 18px 10px; border-bottom:1px solid var(--line); }
.ch-av{ width:38px; height:38px; border-radius:50%; background:var(--g); color:#fff; display:flex; align-items:center; justify-content:center; }
.chat-head b{ font-size:16px; }
.msg{ display:flex; margin-top:10px; }
.msg.anim{ animation:up .3s ease; }
.msg.me{ justify-content:flex-end; }
.bub{ max-width:84%; padding:10px 13px; border-radius:18px; font-size:14.5px; line-height:1.42; }
.me .bub{ background:var(--g); color:#fff; border-bottom-right-radius:6px; }
.calma .bub{ background:var(--card); border-bottom-left-radius:6px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
.bub.wide{ max-width:96%; width:96%; }
.pcard{ border:1.5px solid var(--line); border-radius:14px; padding:10px 12px; margin-top:8px; display:flex; gap:10px; align-items:flex-start; }
.msg.anim .pcard{ animation:up .35s ease both; }
.pcard .tag{ font-size:10.5px; font-weight:800; letter-spacing:.6px; padding:3px 7px; border-radius:6px; flex:none; margin-top:1px; }
.tag.cita{ background:var(--g-bg); color:var(--g-dk); } .tag.enc{ background:var(--amb-bg); color:var(--amb); } .tag.tarea{ background:#ecebf8; color:#5a4fb0; } .tag.casa{ background:#f6e8d8; color:#8a5226; }
.pcard .pm{ flex:1; font-size:14px; } .pcard .pm small{ display:block; color:var(--soft); font-size:12.5px; margin-top:2px; }
.pcard .ed{ color:var(--mute); }
.pcard.done{ border-color:var(--g-lt); background:var(--g-bg); }
.chips{ display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }
.chip{ border:1.5px solid var(--g); color:var(--g-dk); font-weight:600; font-size:13.5px; padding:7px 12px; border-radius:999px; background:var(--card); }
.chip.on{ background:var(--g); color:#fff; }
.sug{ display:flex; gap:8px; overflow-x:auto; padding:8px 16px 4px; scrollbar-width:none; flex:none; }
.sug::-webkit-scrollbar{ display:none; }
.sug button{ flex:none; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:8px 12px; font-size:13px; color:var(--ink); white-space:nowrap; }
.cin{ flex:none; display:flex; align-items:center; gap:8px; margin:4px 16px 30px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:10px 14px; color:var(--mute); font-size:14px; }
.idle{ text-align:center; padding:28px 6px 10px; }
.idle .big{ width:86px; height:86px; border-radius:50%; background:var(--g-bg); color:var(--g); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
.idle h3{ font-size:22px; margin:0 0 6px; letter-spacing:-.4px; }
.idle p{ color:var(--soft); margin:0 0 16px; font-size:14px; line-height:1.5; }
.idle .sgrid{ display:flex; flex-direction:column; gap:8px; text-align:left; }
.idle .sgrid button{ background:var(--card); border-radius:14px; padding:12px 14px; font-size:14.5px; display:flex; gap:10px; align-items:center; box-shadow:0 1px 2px rgba(0,0,0,.04); }
.idle .sgrid button i{ font-style:normal; color:var(--g); font-weight:700; }
.listen{ flex:none; background:var(--card); border-top:1px solid var(--line); padding:14px 18px 16px; text-align:center; }
.wave{ display:flex; gap:4px; justify-content:center; align-items:center; height:42px; }
.wave i{ display:block; width:5px; border-radius:3px; background:var(--g); animation:wv 1s ease-in-out infinite; }
.live{ font-size:15px; line-height:1.45; min-height:44px; margin:8px 0 6px; text-align:left; }
.live:after{ content:"▍"; color:var(--g); animation:blink 1s steps(1) infinite; }
.lrow{ display:flex; gap:10px; align-items:baseline; padding:7px 0; border-top:1px solid var(--line); font-size:14px; }
.lrow:first-child{ border-top:0; }
.lrow .badge{ min-width:76px; text-align:center; }
.src{ font-size:11.5px; color:var(--mute); margin-top:8px; display:flex; gap:6px; align-items:center; }
.draft{ background:var(--g-bg); border-radius:14px; padding:11px 13px; font-size:14.5px; line-height:1.45; margin:8px 0 10px; border-left:3px solid var(--g); }
.typing{ display:flex; gap:4px; padding:4px 2px; }
.typing i{ width:7px; height:7px; border-radius:50%; background:var(--mute); animation:bounce 1s infinite; }
.typing i:nth-child(2){ animation-delay:.15s } .typing i:nth-child(3){ animation-delay:.3s }
.drow{ display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--line); font-size:14px; }
.drow:first-child{ border-top:0; }
.drow .cb{ width:20px; height:20px; border-radius:6px; background:var(--g); color:#fff; display:flex; align-items:center; justify-content:center; flex:none; margin-top:1px; }
.drow small{ display:block; color:var(--soft); font-size:12.5px; }
.soon{ display:inline-block; font-size:11px; font-weight:800; letter-spacing:.6px; background:#ecebf8; color:#5a4fb0; padding:3px 8px; border-radius:6px; margin-bottom:6px; }

/* ---------- Agenda ---------- */
.week{ display:flex; justify-content:space-between; margin:8px 0 6px; }
.week button{ width:42px; padding:6px 0 8px; border-radius:14px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px; color:var(--soft); }
.week button b{ font-size:16px; color:var(--ink); }
.week button.on{ background:var(--g); color:#fff; } .week button.on b{ color:#fff; }
.week .dots{ display:flex; gap:2px; height:5px; }
.week .dots i{ width:5px; height:5px; border-radius:50%; }
.legend{ display:flex; gap:12px; font-size:12px; color:var(--soft); margin:4px 0 2px; }
.legend span{ display:flex; align-items:center; gap:5px; }
.legend i, .sdot{ width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
.dayh{ font-size:13px; font-weight:700; color:var(--soft); margin:16px 0 4px; }
.evr{ display:flex; gap:12px; align-items:center; background:var(--card); border-radius:16px; padding:12px 14px; margin-top:8px; width:100%; text-align:left; }
.evr .eh{ font-weight:700; font-size:14px; width:44px; color:var(--g-dk); }
.evr .em{ flex:1; font-size:14.5px; } .evr .em small{ display:block; color:var(--soft); font-size:12.5px; }
.evr.casa .eh{ color:#a8632a; }
.ess{ margin-top:12px; }
.ess .k{ font-size:12px; letter-spacing:1.2px; text-transform:uppercase; font-weight:700; color:var(--mute); margin:12px 0 4px; }
.ess p{ margin:0; font-size:15px; line-height:1.45; }
.ess ul{ margin:2px 0 0; padding-left:18px; font-size:15px; line-height:1.55; }

/* ---------- Encargos ---------- */
.pc{ background:var(--card); border-radius:18px; padding:14px; margin-top:10px; width:100%; text-align:left; display:block; }
.pc-h{ display:flex; align-items:center; gap:10px; }
.ini{ width:40px; height:40px; border-radius:50%; background:var(--g-bg); color:var(--g-dk); display:flex; align-items:center; justify-content:center; font-weight:700; flex:none; }
.pc-h .nm{ flex:1; font-weight:700; font-size:16px; } .pc-h .nm small{ display:block; font-weight:400; color:var(--soft); font-size:12.5px; }
.enc{ display:flex; gap:10px; align-items:center; padding:9px 0 0; margin-top:9px; border-top:1px solid var(--line); font-size:14px; }
.enc .em{ flex:1; } .enc small{ display:block; color:var(--soft); font-size:12.5px; }
.sheet-bg{ position:absolute; inset:0; background:rgba(15,25,20,.35); z-index:20; display:flex; align-items:flex-end; animation:fade .25s; }
.sheet{ background:var(--card); width:100%; border-radius:26px 26px 0 0; padding:10px 18px 26px; max-height:88%; overflow:auto; animation:up .3s ease; }
.grab{ width:40px; height:5px; border-radius:3px; background:var(--line); margin:4px auto 10px; }
.f-l{ font-size:12px; letter-spacing:1.2px; text-transform:uppercase; font-weight:700; color:var(--mute); margin:14px 0 6px; }
.f-in{ border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; font-size:15px; }
.seg{ display:flex; background:var(--bg); border-radius:12px; padding:3px; }
.seg button{ flex:1; padding:9px; border-radius:10px; font-size:14px; font-weight:600; color:var(--soft); }
.seg button.on{ background:var(--card); color:var(--g-dk); box-shadow:0 1px 3px rgba(0,0,0,.08); }

/* ---------- Plazos y cámara ---------- */
.pz{ display:flex; gap:12px; align-items:center; background:var(--card); border-radius:16px; padding:12px 14px; margin-top:8px; }
.pz .dd{ width:54px; text-align:center; flex:none; }
.pz .dd b{ display:block; font-size:20px; line-height:1; }
.pz .dd small{ font-size:11px; color:var(--soft); }
.pz .pm{ flex:1; font-size:14.5px; } .pz .pm small{ display:block; color:var(--soft); font-size:12.5px; }
.cam{ flex:1; background:#0d1210; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; }
.vf{ width:78%; aspect-ratio:3/4; border-radius:18px; position:relative; display:flex; align-items:center; justify-content:center; }
.vf:before{ content:""; position:absolute; inset:0; border-radius:18px; box-shadow:0 0 0 2px rgba(255,255,255,.7); }
.paper{ width:84%; height:86%; background:#fbfaf6; border-radius:4px; transform:rotate(-2deg); padding:16px 14px; color:#333; font-size:9px; line-height:1.5; box-shadow:0 10px 20px rgba(0,0,0,.4); overflow:hidden; }
.paper b{ display:block; font-size:10.5px; margin-bottom:6px; }
.paper i{ display:block; height:5px; background:#e3e1da; border-radius:2px; margin:6px 0; }
.paper .hl2{ background:#ffe9a8; padding:1px 2px; }
.scan{ position:absolute; left:6%; right:6%; height:3px; background:var(--g-lt); box-shadow:0 0 18px var(--g-lt); animation:scan 1.4s ease-in-out infinite; border-radius:2px; }
.shut{ width:70px; height:70px; border-radius:50%; border:4px solid #fff; margin-top:22px; display:flex; align-items:center; justify-content:center; }
.shut i{ width:54px; height:54px; border-radius:50%; background:#fff; display:block; }
.cam .ctop{ position:absolute; top:52px; left:18px; right:18px; display:flex; justify-content:space-between; align-items:center; font-size:14px; }
.tl{ margin-top:8px; }
.tl .ti{ display:flex; gap:12px; padding:10px 0; border-top:1px solid var(--line); align-items:flex-start; }
.tl .ti:first-child{ border-top:0; }
.tl .ti b{ width:62px; flex:none; color:var(--g-dk); font-size:14px; }
.tl .ti span{ font-size:14.5px; }

/* ---------- Pantalla de bloqueo ---------- */
.lock{ position:absolute; inset:0; background:linear-gradient(170deg,var(--g-dk) 0%,var(--g) 55%,#cfdcd5 125%); color:#fff; padding:96px 14px 20px; display:flex; flex-direction:column; }

.screen.casa .lock{ background:linear-gradient(170deg,#3a2414 0%,#7c4519 55%,#d9b38a 125%); }
.lk-time{ text-align:center; font-size:74px; font-weight:300; letter-spacing:-2px; line-height:1; }
.lk-date{ text-align:center; font-size:15px; opacity:.9; margin:4px 0 26px; }
.lk-notes{ display:flex; flex-direction:column; gap:9px; }
.nt{ background:rgba(255,255,255,.9); color:var(--ink); border-radius:20px; padding:11px 13px; text-align:left; width:100%; }
.nt.new{ animation:drop .5s cubic-bezier(.2,.9,.3,1.2); }
.nt.old{ opacity:.82; transform:scale(.97); }
.nt-h{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--soft); margin-bottom:3px; font-weight:600; }
.nt-h .ic{ width:18px; height:18px; border-radius:5px; background:var(--g); color:#fff; display:flex; align-items:center; justify-content:center; }
.nt-h em{ margin-left:auto; font-style:normal; font-weight:400; }
.nt b{ font-size:14.5px; } .nt p{ margin:2px 0 0; font-size:14px; line-height:1.38; }
.nt-a{ display:flex; gap:7px; margin-top:9px; }
.nt-a button{ flex:1; background:var(--g-bg); color:var(--g-dk); border-radius:11px; padding:8px; font-size:13px; font-weight:700; }
.lk-hint{ margin-top:auto; text-align:center; font-size:12.5px; opacity:.8; }

/* ---------- WhatsApp simulado ---------- */
.wa{ flex:1; display:flex; flex-direction:column; background:#ece5dd; }
.wa-h{ background:#1f6e5a; color:#fff; padding:52px 14px 12px; display:flex; align-items:center; gap:10px; }
.wa-h .ini{ background:rgba(255,255,255,.2); color:#fff; }
.wa-body{ flex:1; padding:16px; display:flex; flex-direction:column; justify-content:flex-end; }
.wa-tip{ align-self:center; background:#fff8d6; color:#5b4a12; font-size:13px; border-radius:10px; padding:8px 12px; margin-bottom:14px; text-align:center; box-shadow:0 1px 1px rgba(0,0,0,.08); }
.wa-bar{ display:flex; gap:8px; align-items:flex-end; padding:8px 10px 20px; }
.wa-in{ flex:1; background:#fff; border-radius:22px; padding:11px 14px; font-size:14.5px; line-height:1.4; color:#1c1c1c; }
.wa-send{ width:48px; height:48px; border-radius:50%; background:#1f8f6e; color:#fff; display:flex; align-items:center; justify-content:center; flex:none; animation:pulse 1.4s infinite; }
.wa-sent{ align-self:flex-end; background:#d9fdd3; border-radius:12px 12px 4px 12px; padding:8px 11px; font-size:14.5px; max-width:85%; color:#1c1c1c; box-shadow:0 1px 1px rgba(0,0,0,.08); animation:up .3s; }

.rp-dots{ display:flex; gap:6px; margin:6px 0 4px; }

.rp-dots i.on{ background:var(--g); }
.rp-nav{ display:flex; gap:10px; padding:10px 18px 22px; flex:none; }
.rp-nav .btn{ flex:1; }
.ob{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:20px 30px; }
.ob .big{ width:120px; height:120px; border-radius:50%; background:var(--g-bg); color:var(--g); display:flex; align-items:center; justify-content:center; margin-bottom:28px; }

.sw:after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:left .2s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
.sw.on{ background:var(--g); } .sw.on:after{ left:21px; }
.know{ padding:10px 0; border-top:1px solid var(--line); font-size:14.5px; display:flex; gap:10px; align-items:flex-start; }
.know:first-of-type{ border-top:0; }
.know small{ display:block; color:var(--mute); font-size:12px; margin-top:2px; }
.know button{ color:var(--g); font-size:13px; font-weight:600; flex:none; }
.fin-i{ display:flex; gap:10px; align-items:center; background:var(--card); border-radius:14px; padding:11px 12px; margin-top:7px; width:100%; text-align:left; font-size:14px; }
.fin-i .bx{ width:22px; height:22px; border-radius:6px; border:2px solid var(--g); flex:none; display:flex; align-items:center; justify-content:center; color:#fff; }
.fin-i.on .bx{ background:var(--g); }
.fin-i b{ width:22px; color:var(--g-dk); font-size:13px; flex:none; }

/* ---------- Ordenador ---------- */
.desk{ flex:1; display:flex; flex-direction:column; padding:22px 26px; overflow:auto; background:var(--bg); }
.desk-top{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }

.desk-g2{ display:grid; grid-template-columns:1fr .6fr; gap:12px; }
.desk .card{ margin-top:12px; }

@keyframes up{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
@keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
@keyframes drop{ from{ opacity:0; transform:translateY(-30px) scale(.95); } to{ opacity:1; transform:none; } }
@keyframes wv{ 0%,100%{ height:8px } 50%{ height:38px } }
@keyframes blink{ 50%{ opacity:0 } }
@keyframes bounce{ 0%,60%,100%{ transform:none } 30%{ transform:translateY(-5px) } }
@keyframes scan{ 0%{ top:8% } 50%{ top:88% } 100%{ top:8% } }
@keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(31,143,110,.5) } 100%{ box-shadow:0 0 0 14px rgba(31,143,110,0) } }

/* ---------- móvil: la app a pantalla completa ---------- */
@media (max-width:820px){

  .gm-row button{ width:38px; height:38px; border-radius:12px; background:var(--g-bg); color:var(--g-dk); display:flex; align-items:center; justify-content:center; flex:none; font-weight:700; }
  .gm-row button.main{ background:var(--g); color:#fff; }
  .gm-row .pill{ width:auto; padding:0 12px; font-size:13px; }
  .device{ width:100%; height:auto; flex:1; min-height:0; border-radius:0; padding:0; box-shadow:none; background:var(--bg); }
  .device.monitor{ width:100%; height:auto; border-radius:0; padding:0; }
  .screen{ border-radius:0; }
  .sb{ display:none; }
  .lock{ padding-top:40px; }
  .cam .ctop{ top:16px; }
  .wa-h{ padding-top:14px; }
  .desk-g, .desk-g2{ grid-template-columns:1fr; }
  .desk{ padding:16px; }
}

<script>

const VERSION = 'Propuesta de diseño 1.0.2';
const $ = s => document.querySelector(s);

const ic = {
  mic: s => svg('<rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" stroke="none"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>', s),
  home: s => svg('<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>', s),
  cal: s => svg('<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>', s),
  users: s => svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>', s),

  { id: 'gestor', h: 14, f: 15.5, hh: '14:00', t: 'Comida con el gestor', d: 'Subvención y contrato', src: 'g', tipo: 'trabajo',
    con: 'El gestor', ultima: 'Te iba a mandar el borrador del contrato. Lleva cinco días sin noticias.',
    pend: ['Preguntarle por el borrador del contrato', 'Revisar juntos los papeles de la subvención'], llevar: 'La resolución de la subvención' },
  { id: 'taller', h: 17.5, f: 18.5, hh: '17:30', t: 'Taller', d: 'Revisión del proyecto', src: 'ms', tipo: 'trabajo',
    con: 'El jefe de taller', ultima: 'Faltaban las fotos de la máquina para el cliente.', pend: ['Ver las fotos antes de enviarlas'], llevar: '' },
  { id: 'dentista', h: 19.5, f: 20, hh: '19:30', t: 'Dentista', d: 'Revisión', src: 'movil', tipo: 'casa' },
];
const SEMANA = [
  { d: 'Mañana · viernes', ev: [
    { hh: '9:00', t: 'Videollamada con un cliente', d: 'Oferta nueva', src: 'ms', tipo: 'trabajo' },
    { hh: '12:00', t: 'Comida con los de la feria', d: 'Lo apuntaste hablando', src: 'g', tipo: 'trabajo' }] },
  { d: 'Sábado', ev: [{ hh: '13:30', t: 'Cumpleaños: comprar regalo', d: 'Casa', src: 'movil', tipo: 'casa' }] },
  { d: 'Lunes', ev: [{ hh: '9:00', t: 'Reunión semanal del equipo', d: 'Lo pendiente y lo acordado', src: 'ms', tipo: 'trabajo' }] },
];
const PERSONAS = [
  { id: 'conta', n: 'Contabilidad', ini: 'C', res: '2 encargos · 1 va tarde', st: 'tarde',
    enc: [{ t: 'Certificado de Hacienda', s: 'Para mañana · 3 días sin noticias · te consulta antes', st: 'tarde' },
          { t: 'Cierre del trimestre', s: 'Para el lunes · decide ella', st: 'ok' }],
    quedo: 'El lunes quedasteis en cerrar el trimestre antes del día 10.', prox: 'Reunión semanal · lunes 9:00' },
  { id: 'taller', n: 'El taller', ini: 'T', res: '1 encargo · al día', st: 'ok',

    quedo: 'Te iba a mandar el borrador del contrato esta semana.', prox: 'Hoy · comida a las 14:00' },
  { id: 'jefe', n: 'El jefe', ini: 'J', res: '1 tema para hablar · al día', st: 'ok',
    enc: [{ t: 'Decidir si vamos a la feria de marzo', s: 'Para hablar el domingo', st: 'ok' }],
    quedo: 'Lo hablaréis en vuestro rato de los domingos.', prox: 'Domingo · 18:00' },
];
const PLAZOS = [
  { t: 'Certificado de Hacienda', s: 'Encargo a contabilidad', dias: 1, rd: 'Certificado' },
  { t: 'Cuota del préstamo', s: 'Banco', dias: 8, rd: 'Cuota préstamo' },
  { t: 'Justificar la subvención', s: 'Faltan 2 documentos', dias: 12, rd: 'Subvención' },
  { t: 'Renovar la póliza de crédito', s: 'Banco', dias: 24, rd: 'Póliza' },
  { t: 'ITV de la furgoneta', s: 'Taller', dias: 40 },

const NOTES = {
  b1: { h: '8:00', t: 'Buenos días', b: 'Hoy: 3 citas de trabajo y el dentista. Lo importante: el certificado de contabilidad, que vence mañana.' },
  b2: { h: '9:40', t: 'Banco en 20 minutos', b: 'La última vez quedasteis en revisar el préstamo. Lleva el balance.', act: [['esencial', 'Ver lo esencial']] },
  b3: { h: '12:00', t: 'Contabilidad aún no ha enviado el certificado', b: 'Vence mañana. Lleva 3 días sin noticias.', act: [['manana', 'Recordar mañana'], ['escribe', 'Escríbele']] },
  b4: { h: '11:30', t: 'Justificar la subvención: 12 días', b: 'Te faltan 2 documentos. ¿Te preparo la lista?' },
  b5: { h: '21:00', t: 'Buenas noches', b: 'Hoy has hecho 6 cosas. Quedan 2: ¿las paso a mañana?', act: [['pasar', 'Pasar a mañana'], ['ver', 'Ver']] },
};
const TXT_APUNTA = 'Mañana a las doce, comida con los de la feria. Encárgale al taller el presupuesto de la grúa para el martes. Y tengo que llamar al seguro.';
const CARDS_APUNTA = [

/* ---------- estado ---------- */

  notes: [], casa: false, calm: false, theme: 'calma', person: null, event: null, cam: null, plazoOk: false,
  rep: 0, wa: null, waSent: false, filter: 'todo', marks: new Set(), ob: 0, sheet: null, toast: null,

/* ---------- utilidades de pantalla ---------- */
const hourOf = c => { const m = /^(\d{1,2}):(\d{2})$/.exec(c); return m ? +m[1] + m[2] / 60 : 9.6; };
const pct = h => Math.max(0, Math.min(100, (h - 8) / 13 * 100));
const stIcon = st => `<span class="st ${st}">${st === 'ok' ? ic.check(14) : st === 'tarde' ? ic.alert(14) : ic.hour(13)}</span>`;
const dayBadge = d => d <= 3 ? 'b-red' : d <= 14 ? 'b-amb' : 'b-ok';
function toast(txt, ms = 2600) { S.toast = txt; render(); after(ms, () => { S.toast = null; render(); }); }

function statusBar(light) {
  return `<div class="sb ${light ? 'light' : ''}"><span>${/:/.test(S.clock) ? S.clock : '9:35'}</span><span class="sb-ic">${ic.bell(14)}<i></i></span></div>`;
}
function navBar() {
  const it = (k, l, i) => `<button class="${S.tab === k && !S.view ? 'on' : ''}" data-act="tab:${k}">${i(23)}<span>${l}</span></button>`;

/* ---------- tarjetas reutilizables ---------- */
function cardDia(wide) {
  const now = hourOf(S.clock);
  const evs = HOY.map(e => `<div class="ev ${e.tipo === 'casa' ? 'casa' : ''}" style="left:${pct(e.h)}%;width:${pct(e.f) - pct(e.h)}%"></div>`).join('');
  const next = HOY.filter(e => e.f > now && (S.casa ? e.tipo === 'casa' : true)).slice(0, wide ? 4 : 3);
  const rows = next.map(e => `<button class="row" data-act="event:${e.id}" style="width:100%;text-align:left"><b style="width:46px;color:var(--g-dk);font-size:14px">${e.hh}</b><div class="r-main">${e.t}<small>${e.d}</small></div><span class="sdot" style="background:var(--src-${e.src})"></span></button>`);

    <div class="rp-dots">${steps.map((_, i) => `<i class="${i <= S.rep ? 'on' : ''}"></i>`).join('')}</div>
    <h1 class="h2" style="margin-top:12px">${s[0]}</h1><div class="card">${s[1]}</div></div>
    <div class="rp-nav">${S.rep > 0 ? `<button class="btn soft" data-act="rep:${S.rep - 1}">Atrás</button>` : ''}${S.rep < 3 ? `<button class="btn" data-act="rep:${S.rep + 1}">Siguiente</button>` : `<button class="btn" data-act="back">Terminar</button>`}</div>`;
}
const DELEG = [
  ['Preparar los papeles de la subvención', 'Contabilidad · te consulta antes de enviar'],
  ['Pedir tres presupuestos de la grúa', 'El taller · decide él'],
  ['Reservar el hotel de la feria', 'Administración · decide ella'],
  ['Contestar al proveedor de motores', 'El taller · te consulta'],
  ['Revisar el seguro de la furgoneta', 'Contabilidad · decide ella'],
];
function vTu() {
  const sw = (on, act) => `<span class="sw ${on ? 'on' : ''}" data-act="${act}"></span>`;
  return `<div class="content"><button class="back" data-act="back">${ic.back(18)} Hoy</button><h1 class="h2">Tú</h1><div class="dim">Cómo quieres que te ayude Calma</div>
    <div class="card"><div class="c-t">Avisos</div>
      <div class="row"><div class="r-main">Resumen de la mañana<small>8:00</small></div></div>
      <div class="row"><div class="r-main">Repaso de la noche<small>21:00</small></div></div>
      <div class="row"><div class="r-main">Como mucho 3 avisos al día<small>El resto, en el resumen</small></div>${sw(S.avisos.max3, 'sw:max3')}</div>
      <div class="row"><div class="r-main">Modo casa<small>De 21:00 a 8:00, nada de trabajo</small></div>${sw(S.avisos.casa, 'sw:casa')}</div></div>
    <div class="card"><div class="c-t">Calendarios conectados</div>${Object.keys(SRC).map(k => `<div class="row"><span class="sdot" style="background:var(--src-${k})"></span><div class="r-main">${SRC[k]}</div>${sw(S.conn[k], 'conn:' + k)}</div>`).join('')}</div>
    <div class="card"><div class="c-t">Lo que sé de ti</div>${S.knows.map((k, i) => `<div class="know"><div style="flex:1">${k.t}<small>${k.s}</small></div><button data-act="forget:${i}">Olvidar</button></div>`).join('') || '<div class="dim">Nada guardado.</div>'}
      <div class="dim" style="margin-top:8px">Lo nuevo siempre te lo pregunto antes de guardarlo.</div></div>
    <div class="card"><div class="c-t">Tus datos</div><div style="font-size:14.5px;line-height:1.6">Solo veo lo que me dices o fotografías, y tus calendarios.<br>No leo tu correo ni tu WhatsApp.<br>No envío nada sin tu toque.<br>Lo tuyo personal no lo ve nadie más.</div></div>
    <div class="card"><div class="c-t">Probar</div>
      <div class="row"><div class="r-main">Con los colores de tu empresa</div>${sw(S.theme === 'empresa', 'theme')}</div>
      <button class="row" data-act="avisos" style="width:100%;text-align:left"><div class="r-main">Ver los avisos de ejemplo</div>${ic.next(16)}</button>
      <button class="row" data-act="ob" style="width:100%;text-align:left"><div class="r-main">Ver la bienvenida</div>${ic.next(16)}</button></div>
    <div class="dim" style="text-align:center;margin:14px 0 4px">${VERSION} · datos inventados · sin IA real</div></div>`;
}
function vOnb() {
  const sl = [
    [ic.mic(56), 'Háblame como a una secretaria de confianza', 'Suéltalo como te salga. Yo lo ordeno, te lo enseño y tú confirmas con un toque.'],
    [ic.bell(56), 'Te aviso poco, pero cuando importa', 'Un resumen por la mañana, un repaso por la noche y avisos sueltos solo para lo que tiene hora. Nunca más de tres al día.'],
    [ic.shield(56), 'Tus datos son tuyos', 'Solo veo lo que me cuentas y tus calendarios. No envío nada sin ti.'],
  ];
  const s = sl[S.ob];
  const conn = S.ob === 2 ? `<div class="conn">${Object.keys(SRC).map(k => `<button data-act="conn:${k}"><span class="sdot" style="background:var(--src-${k})"></span><span>Conectar ${SRC[k]}</span><span class="sw ${S.conn[k] ? 'on' : ''}"></span></button>`).join('')}</div>` : '';
  return `<div class="ob"><div class="big">${s[0]}</div><h2>${s[1]}</h2><p>${s[2]}</p>${conn}
    <div class="ob-dots">${sl.map((_, i) => `<i class="${i === S.ob ? 'on' : ''}"></i>`).join('')}</div>
    <button class="btn block" data-act="${S.ob < 2 ? 'obn' : 'obend'}">${S.ob < 2 ? 'Siguiente' : 'Empezar'}</button></div>`;
}
function vDesktop() {
  return `<div class="desk"><div class="desk-top"><span class="tb-logo">${ic.mic(18)}</span><div style="flex:1"><div class="dim">Jueves · 9:35</div><h1 class="hl">Todo bajo control. <span>Dos cosas te necesitan.</span></h1></div><button class="btn small soft" data-act="back">${ic.back(14)} Volver al móvil</button></div>
    ${cardDia(true)}<div class="desk-g">${cardNecesita()}${cardEncargos()}<div class="card"><div class="c-t">Tu semana</div><div style="display:flex;align-items:flex-end;gap:8px;height:90px">${[40, 56, 50, 100, 30].map((h, i) => `<div style="flex:1;height:${h}%;border-radius:6px 6px 0 0;background:${i === 3 ? 'var(--g-dk)' : 'var(--g-lt)'}"></div>`).join('')}</div><div style="display:flex;gap:8px;font-size:11px;color:var(--mute);margin-top:4px">${'LMXJV'.split('').map(d => `<span style="flex:1;text-align:center">${d}</span>`).join('')}</div><div class="dim" style="margin-top:6px">El jueves va muy cargado.</div></div></div>
    <div class="desk-g2">${cardPlazos()}${cardCasa()}</div></div>`;
}
function vSheet() {
  if (S.sheet === 'lista') return `<div class="sheet-bg" data-act="closesheet"><div class="sheet" data-stop="1"><div class="grab"></div>
    <div style="font-size:20px;font-weight:700">Las 12 funciones</div><div class="dim" style="margin:2px 0 8px">Toca una para verla</div>
    <div class="g-list" style="max-height:none">${FUN.map((f, i) => `<button data-act="see:${i}"><b>${i + 1}</b><span>${f}</span><em>Ver ›</em></button>`).join('')}</div></div></div>`;
  if (S.sheet !== 'nuevo') return '';
  return `<div class="sheet-bg" data-act="closesheet"><div class="sheet" data-stop="1"><div class="grab"></div><div style="font-size:20px;font-weight:700">Nuevo encargo</div>
    <div class="f-l">¿A quién?</div><div class="chips" style="margin:0">${PERSONAS.map((p, i) => `<span class="chip ${i === 0 ? 'on' : ''}">${p.n}</span>`).join('')}</div>
    <div class="f-l">¿Qué?</div><div class="f-in">Preparar los papeles de la subvención</div>
    <div class="f-l">¿Para cuándo?</div><div class="chips" style="margin:0"><span class="chip">Mañana</span><span class="chip on">Viernes</span><span class="chip">Elegir día</span></div>
    <div class="f-l">¿Cuánta autonomía tiene?</div><div class="seg"><button>Decide ella</button><button class="on">Me consulta antes</button></div>
    <div class="f-l">¿Cuándo lo reviso?</div><div class="chips" style="margin:0"><span class="chip on">El jueves</span><span class="chip">Un día antes</span></div>
    <button class="btn block" style="margin-top:18px" data-act="savenuevo">Guardar encargo</button>
    <div class="dim" style="text-align:center;margin-top:10px">Te aviso a ti si no llega. No persigo a nadie.</div></div></div>`;
}

/* ---------- pintar ---------- */
function render() {
  document.body.classList.toggle('theme-empresa', S.theme === 'empresa');
  const dev = $('#device'), scr = $('#screen');
  dev.classList.toggle('monitor', S.view === 'desktop');
  scr.className = 'screen' + (S.casa ? ' casa' : '');
  let body = '', nav = true, light = false;
  const v = S.view;
  if (v === 'lock') { body = vLock(); nav = false; light = true; }
  else if (v === 'onboarding') { body = vOnb(); nav = false; }
  else if (v === 'camera') { body = vCamera(); nav = false; light = true; }
  else if (v === 'whatsapp') { body = vWa(); nav = false; light = true; }
  else if (v === 'repaso') { body = vRepaso(); nav = false; }
  else if (v === 'desktop') { body = vDesktop(); nav = false; }
  else if (v === 'event') body = vEvent();
  else if (v === 'person') body = vPerson();
  else if (v === 'plazo') body = vPlazoNuevo();
  else if (v === 'tu') body = vTu();
  else body = ({ hoy: vHoy, agenda: vAgenda, habla: vChat, encargos: vEncargos, plazos: vPlazos }[S.tab])();
  scr.innerHTML = (v === 'desktop' ? '' : statusBar(light)) + body + (nav ? navBar() : '') + vSheet() + (S.toast ? `<div class="toast">${S.toast}</div>` : '');
  const c = scr.querySelector('.chat-scroll'); if (c) c.scrollTop = c.scrollHeight;
  renderGuide();
}
function updateLive() { const el = $('#live'); if (el && S.listening) el.textContent = S.listening.txt; }

/* ---------- navegación ---------- */
function go(tab) { S.view = null; S.tab = tab; S.sheet = null; render(); scrollTop(); }
function setView(v) { S.view = v; S.sheet = null; render(); scrollTop(); }
function scrollTop() { const c = $('#screen .content'); if (c && !c.classList.contains('chat-scroll')) c.scrollTop = 0; }
function openChat(reset) { if (reset) S.chat = []; S.listening = null; S.view = null; S.tab = 'habla'; render(); }

/* ---------- flujos del asistente (simulados) ---------- */
function dictate(txt, done) {
  S.listening = { txt: '' }; render();
  let i = 0;
  const step = () => { i = Math.min(txt.length, i + 2); S.listening.txt = txt.slice(0, i); updateLive();
    if (i < txt.length) after(38, step); else after(500, () => { S.listening = null; S.chat.push({ w: 'me', txt }); render(); done && done(); }); };
  after(450, step);
}
function reply(msg, ms = 900) { S.chat.push({ w: 'calma', k: 'typing' }); render(); after(ms, () => { S.chat = S.chat.filter(m => m.k !== 'typing'); S.chat.push(msg); render(); }); }
function flowApunta() { openChat(true); dictate(TXT_APUNTA, () => reply({ w: 'calma', k: 'cards', items: CARDS_APUNTA })); }
function pushWhen() { S.chat.push({ w: 'calma', k: 'when', task: 'Llamar al seguro' }); render(); }
function ask(txt, msg) { openChat(true); S.chat.push({ w: 'me', txt }); render(); reply(msg, 1000); }
const MSG_VENCE = { w: 'calma', k: 'list', title: 'Este mes vence esto:', foot: 'Sacado de tus plazos y de la foto del 3 de noviembre', rows: [
  { b: 'Mañana', c: 'b-red', t: 'Certificado de Hacienda', s: 'Lo tiene contabilidad' }, { b: '8 días', c: 'b-amb', t: 'Cuota del préstamo' },
  { b: '12 días', c: 'b-amb', t: 'Justificar la subvención', s: 'Faltan 2 documentos' }, { b: '24 días', c: 'b-ok', t: 'Renovar la póliza de crédito' }] };
const MSG_DELEG = () => ({ w: 'calma', k: 'deleg', rows: DELEG });
const MSG_HUECOS = { w: 'calma', k: 'huecos', rows: [['Mar 9:00', 'Martes de 9:00 a 11:00 · sin reuniones'], ['Jue 16:00', 'Jueves de 16:00 a 18:00 · después del taller']] };
function draftTo(id) {
  const p = PERSONAS.find(x => x.id === id) || PERSONAS[0];
  openChat(true);
  if (id === 'gestor') S.chat.push({ w: 'me', txt: 'Dile al gestor que el jueves no puedo, que lo pasamos al viernes.' });
  render();
  reply({ w: 'calma', k: 'draft', to: id, intro: id === 'gestor' ? 'Te lo dejo así:' : `${p.n} aún no ha respondido. Te dejo este mensaje:`, txt: DRAFTS[id] });
}
function demo(k) {
  if (k === 'apunta') flowApunta();
  else if (k === 'vence') ask('¿Qué vence este mes?', MSG_VENCE);
  else if (k === 'delegar') ask('¿Qué podría delegar esta semana?', MSG_DELEG());
  else if (k === 'gestor') draftTo('gestor');
  else if (k === 'huecos') ask('¿Cuándo puedo preparar lo del préstamo? Son unas dos horas.', MSG_HUECOS);
}

/* ---------- acciones (un solo manejador de toques) ---------- */
function act(a) {
  const [k, x, y] = a.split(':');
  switch (k) {
    case 'tab': go(x); break;
    case 'mic': if (S.listening) break; clearT(); flowApunta(); break;
    case 'demo': clearT(); demo(x); break;
    case 'tu': setView('tu'); break;
    case 'back': S.cam = null; S.waSent = false; if (S.view === 'person' || S.view === 'event' || S.view === 'plazo') { S.view = null; } else { S.view = null; } render(); break;
    case 'event': S.event = x; setView('event'); break;
    case 'person': S.person = x; setView('person'); break;
    case 'filter': S.filter = x; render(); break;
    case 'calm': S.calm = !S.calm; render(); break;
    case 'casa': S.casa = !S.casa; if (S.casa) S.clock = '21:05'; else S.clock = '9:35'; go('hoy'); break;
    case 'desktop': setView('desktop'); break;
    case 'repaso': S.rep = 0; setView('repaso'); break;
    case 'rep': S.rep = +x; render(); break;
    case 'camera': S.cam = null; S.plazoOk = false; setView('camera'); break;
    case 'shoot': S.cam = 'reading'; render(); after(1700, () => { S.cam = null; setView('plazo'); }); break;
    case 'plazook': S.plazoOk = true; render(); break;
    case 'nuevo': S.sheet = 'nuevo'; render(); break;
    case 'closesheet': S.sheet = null; render(); break;
    case 'savenuevo': S.sheet = null; toast('Encargo guardado. Te aviso si no llega.'); break;
    case 'confirm': { const m = S.chat[+x]; if (m) { m.done = true; render(); after(500, pushWhen); } break; }
    case 'when': { const m = S.chat[+x]; if (m && !m.pick) { m.pick = y; S.chat.push({ w: 'me', txt: y }); render(); reply({ w: 'calma', txt: `Apuntado: llamar al seguro, ${y.toLowerCase()}. <b>Tres cosas fuera de tu cabeza.</b>` }); } break; }
    case 'draft': draftTo(x); break;
    case 'wa': S.wa = x; S.waSent = false; setView('whatsapp'); break;
    case 'wasend': S.waSent = true; render(); after(900, () => toast('En la demo no se envía nada de verdad.')); break;
    case 'delegok': { const m = S.chat[+x]; if (m) { m.done = true; render(); } break; }
    case 'delegsave': toast('5 encargos preparados. Los ves en Encargos.'); break;
    case 'note': noteTap(x); break;
    case 'nact': noteAct(x, y); break;
    case 'nota': toast('Pulsarías el micro y dirías lo que se habló. Calma lo reparte en personas y tareas.'); break;
    case 'sw': S.avisos[x] = !S.avisos[x]; render(); break;
    case 'conn': S.conn[x] = !S.conn[x]; render(); break;
    case 'forget': S.knows.splice(+x, 1); render(); break;
    case 'theme': S.theme = S.theme === 'empresa' ? 'calma' : 'empresa'; render(); break;
    case 'avisos': S.clock = '12:00'; S.notes = ['b3', 'b4', 'b2', 'b1']; setView('lock'); break;
    case 'ob': S.ob = 0; setView('onboarding'); break;
    case 'obn': S.ob++; render(); break;
    case 'obend': go('hoy'); break;
    case 'mark': S.marks.has(+x) ? S.marks.delete(+x) : S.marks.add(+x); render(); break;
    case 'see': S.sheet = null; seeFun(+x); break;
    case 'lista': S.sheet = 'lista'; render(); break;
  }
}
function noteTap(id) {
  if (id === 'b1') { S.clock = '8:01'; go('hoy'); }
  else if (id === 'b2') { S.clock = '9:41'; S.event = 'banco'; setView('event'); }
  else if (id === 'b3') { S.clock = '12:01'; draftTo('conta'); }
  else if (id === 'b4') { S.clock = '11:31'; go('plazos'); }
  else if (id === 'b5') { S.casa = true; S.clock = '21:01'; go('hoy'); }
}
function noteAct(id, a) {
  if (a === 'esencial') noteTap('b2');
  else if (a === 'escribe') noteTap('b3');
  else if (a === 'manana') toast('Te lo recuerdo mañana a las 9:00.');
  else if (a === 'pasar') toast('Las 2 que quedan, pasadas a mañana.');
  else if (a === 'ver') noteTap('b5');
}
function seeFun(i) {
  clearT();
  const f = [() => demo('apunta'), () => go('encargos'), () => go('plazos'), () => { S.rep = 0; setView('repaso'); },
    () => act('avisos'), () => { S.casa = false; S.calm = false; S.clock = '9:35'; go('hoy'); }, () => demo('gestor'), () => demo('delegar'),
    () => { S.event = 'banco'; setView('event'); }, () => go('agenda'), () => { S.casa = true; S.clock = '21:05'; go('hoy'); }, () => demo('huecos')];
  f[i]();
}
document.addEventListener('click', e => {
  const stop = e.target.closest('[data-stop]'); const el = e.target.closest('[data-act]');
  if (!el) return;
  if (stop && el.dataset.act === 'closesheet') return;
  e.preventDefault(); act(el.dataset.act);
});

/* ---------- guía (al lado en el ordenador, arriba en el móvil) ---------- */
function renderGuide() {
  const g = $('#guide');
  g.innerHTML = `<div class="g-card"><div class="g-step">Explorar la app</div><div class="g-title" style="margin-top:10px">Toca lo que quieras</div>
    <p class="g-text">Abajo tienes las pestañas y el micro en el centro. O salta directamente a cada punto de la lista:</p>
    <div class="g-list">${FUN.map((f, i) => `<button data-act="see:${i}"><b>${i + 1}</b><span>${f}</span><em>Ver ›</em></button>`).join('')}</div>
    <div class="g-foot">${VERSION} · datos inventados · sin IA real.</div></div>
    <div class="g-mobile"><div class="gm-row"><div class="gm-t"><b>Calma · propuesta de diseño</b><span>Toca las pestañas y el micro.</span></div><button class="main pill" data-act="lista">Las 12</button></div></div>`;
}
document.addEventListener('keydown', e => { if (e.key === 'c' || e.key === 'C') act('theme'); });
$('#tbLogo').innerHTML = ic.mic(16);

/* ---------- arranque ---------- */
/* Enlaces directos: ?tema=empresa (colores de su empresa) · ?ver=encargos o ?ver=3 (abre esa parte) */
const Q = new URLSearchParams(location.search);
if (Q.get('tema') === 'empresa') S.theme = 'empresa';
go('hoy');
if (Q.get('ver')) { const v = Q.get('ver'); if (/^\d+$/.test(v)) seeFun(+v - 1); else if (['hoy', 'agenda', 'habla', 'encargos', 'plazos'].includes(v)) go(v); else act(v); }
</script>
</body>
